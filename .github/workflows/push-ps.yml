name: onpush

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'        

      - name: Install dependencies (none needed, but keeps npm cache)
        run: npm ci   

      - name: Run tests
        run: npm test